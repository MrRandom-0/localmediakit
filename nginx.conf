# nginx serving the production build.
#
# The two Cross-Origin-* headers are not decoration: ffmpeg.wasm needs
# SharedArrayBuffer, and browsers only enable that on cross-origin-isolated
# pages. Without these headers the Video & Audio Studio turns itself off.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation — required for the video engine.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hashed build assets can be cached forever; index.html must not be,
    # or deploys would take a day to reach people.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # SPA routing: every unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
